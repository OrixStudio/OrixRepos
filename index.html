<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Fixed Desktop Viewport -->
    <meta name="viewport" content="width=1024, initial-scale=1.0">
    <title>OrixRepos | APT Package Repository</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-purple: #bc8cff;
            --terminal-header: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2.5rem 1rem;
            min-width: 900px; /* Force desktop width layout */
        }

        .container {
            width: 850px; /* Fixed desktop width */
        }

        /* Header Styling */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--accent-blue);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Terminal Window Card */
        .terminal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
        }

        .terminal-header {
            background-color: var(--terminal-header);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot.red { background-color: #ff5f56; }
        .dot.yellow { background-color: #ffbd2e; }
        .dot.green { background-color: #27c93f; }

        .terminal-title {
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Tree View Body */
        .terminal-body {
            padding: 1.25rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.95rem;
            line-height: 1.7;
            text-align: left;
            overflow-x: auto;
        }

        .dir { color: var(--accent-blue); font-weight: 600; }
        .file-link { color: var(--accent-green); text-decoration: none; transition: opacity 0.2s; }
        .file-link:hover { text-decoration: underline; opacity: 0.8; }
        .size { color: var(--text-muted); font-size: 0.85rem; }

        /* Quick Install Section */
        .install-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .install-box h2 {
            font-size: 1.1rem;
            color: var(--accent-purple);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .code-block {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .code-block code {
            white-space: nowrap;
        }

        .copy-btn {
            background: var(--terminal-header);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-family: inherit;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background-color: var(--border-color);
            color: #fff;
        }

        footer {
            margin-top: auto;
            padding-top: 2.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>📦 OrixRepos</h1>
            <p>Official Universal APT Package Repository for Termux</p>
        </header>

        <!-- Live Tree Terminal -->
        <div class="terminal-card">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <span class="dot red"></span>
                    <span class="dot yellow"></span>
                    <span class="dot green"></span>
                </div>
                <div class="terminal-title">tree ~/OrixRepos/packages</div>
            </div>
            <div class="terminal-body" id="tree">
                <span style="color: var(--text-muted);">Fetching live packages tree...</span>
            </div>
        </div>

        <!-- Quick Install Commands -->
        <div class="install-box">
            <h2>🚀 Add Repository to Termux</h2>
            <div class="code-block">
                <code id="cmd1">echo "deb [trusted=yes] https://orixstudio.github.io/OrixRepos ./" > $PREFIX/etc/apt/sources.list.d/orix.list</code>
                <button class="copy-btn" onclick="copyText('cmd1', this)">Copy</button>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>Maintained by OrixStudio &copy; 2026</p>
        </footer>
    </div>

    <script>
        const USER = 'OrixStudio';
        const REPO = 'OrixRepos';
        const FOLDER = 'packages';

        async function fetchPackagesTree() {
            const container = document.getElementById('tree');
            try {
                const response = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${FOLDER}`);
                if (!response.ok) throw new Error('Unable to fetch packages folder.');
                
                const data = await response.json();
                let output = `<span class="dir">.</span>\n└── <span class="dir">${FOLDER}/</span>\n`;

                data.forEach((item, index) => {
                    const isLast = index === data.length - 1;
                    const prefix = isLast ? '    └── ' : '    ├── ';
                    const sizeKB = (item.size / 1024).toFixed(1);
                    output += `${prefix}<a class="file-link" href="${item.download_url}">${item.name}</a> <span class="size">(${sizeKB} KB)</span>\n`;
                });

                container.innerHTML = `<pre>${output}</pre>`;
            } catch (err) {
                container.innerHTML = `<span style="color: #ff5f56;">Error loading live tree: ${err.message}</span>`;
            }
        }

        function copyText(elementId, btn) {
            const text = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.innerText;
                btn.innerText = 'Copied! ✓';
                btn.style.backgroundColor = 'var(--accent-green)';
                btn.style.color = '#fff';
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                }, 2000);
            });
        }

        fetchPackagesTree();
    </script>
</body>
</html>
